name: windows-test

# Tier 2 of cross-platform validation: native Windows (amd64) unit tests.
# Marked continue-on-error (non-blocking): the toolchain/DLL path is new AND the
# suite has a large backlog of pre-existing Windows-specific test failures
# (path separators, error categories, file handling). The job reports them for
# visibility; promote it to a required check once they are fixed. See the
# cross-platform test-cleanup tracking issue. Runs the portable unit subset only:
# the mosquitto service container and Docker testcontainer suites are not
# available here, and MQTT tests self-skip (MQTT_TEST_BROKER unset).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Taskfile.yml'
      - '.github/workflows/windows-test.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Taskfile.yml'
      - '.github/workflows/windows-test.yml'
      - '.github/actions/**'

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-windows:
    name: unit-tests (windows-amd64)
    runs-on: windows-latest
    # Non-blocking until the native Windows CGO/DLL path is proven stable.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Pinned, NOT go-version-file, deliberately: this is the only job that
          # does not follow go.mod's 1.26.1. Go 1.26.1 on windows/amd64 produced
          # states that are not reachable by correct code on this job, twice over:
          #
          #   1. Under -race, "fatal error: invalid g status" / "unexpected signal
          #      during runtime execution" with GC mark/preemption frames and
          #      goid=0 (removed -race in #54 to stop it red-flagging PRs).
          #   2. Without -race, a nil-pointer crash inside encoding/json's
          #      addrMarshalerEncoder at addr=0x18, which is itab.Fun[0] for a nil
          #      json.Marshaler. That interface is nil only if
          #      reflect.TypeAssert[Marshaler] returned false for a *time.Time -
          #      verified locally under 1.26.1 to be impossible (ok=true, marshals
          #      fine). See #60.
          #
          # Two different impossible states on one platform point at the toolchain,
          # not the code. 1.26.8 keeps the same minor version releases build with
          # while picking up seven patch releases of runtime/compiler fixes. Every
          # other job still tracks go.mod, so this pin only affects native Windows
          # validation. Revisit when go.mod's Go version moves past this.
          go-version: '1.26.8'
          cache: true
      # Printed so the pin above is visible in the log without reading the workflow.
      - run: go version

      - name: Resolve tool versions from Taskfile
        run: |
          # Single source of truth: read versions from the Taskfile so these checks
          # never validate against a stale TFLite/ONNX version after a Taskfile bump.
          tflite=$(grep -E '^[[:space:]]*TFLITE_VERSION:' Taskfile.yml | head -1 | tr -d ' ' | cut -d: -f2 | tr -d "'\"")
          onnx=$(grep -E '^[[:space:]]*ONNXRUNTIME_VERSION:' Taskfile.yml | head -1 | tr -d ' ' | cut -d: -f2 | tr -d "'\"")
          if [ -z "$tflite" ] || [ -z "$onnx" ]; then echo "::error::could not read tool versions from Taskfile.yml"; exit 1; fi
          {
            echo "TFLITE_VERSION=${tflite}"
            echo "ONNXRUNTIME_VERSION=${onnx}"
          } >> "$GITHUB_ENV"

      - name: Add mingw gcc to PATH
        run: |
          # CGO needs a C compiler (the tflite/onnxruntime bindings are cgo);
          # windows-latest ships MSYS2 mingw but not on the default PATH.
          # Prepend it so `gcc` resolves to mingw-w64.
          # printf keeps the backslashes literal without echo escape ambiguity.
          printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Verify gcc
        run: gcc --version

      - name: Install FFmpeg
        run: |
          # Only ffmpeg: sox is not reliably packaged on Chocolatey, and the
          # sox-dependent tests skip when it is absent (exec.LookPath("sox")),
          # so it is not needed to run the suite.
          choco install -y --no-progress ffmpeg

      - name: Setup TensorFlow headers
        run: |
          # Scripted directly rather than via Task: the Taskfile has no MSYS
          # branch (UNAME_S is MINGW64_NT...). Same sparse-checkout the
          # check-tensorflow task performs.
          if [ ! -f .cache/tensorflow/tensorflow/lite/c/c_api.h ]; then
            git clone --branch "${TFLITE_VERSION}" --filter=blob:none --no-checkout --depth 1 \
              https://github.com/tensorflow/tensorflow.git .cache/tensorflow
            git -C .cache/tensorflow sparse-checkout set --no-cone '**/*.h'
            git -C .cache/tensorflow checkout
          fi

      - name: Setup TensorFlow Lite library
        run: |
          # Download the native Windows TFLite DLL and copy it to the name mingw
          # ld resolves for -ltensorflowlite_c (the release cross-build links the
          # same way via the tensorflowlite_c.dll symlink). Native NTFS lacks the
          # symlink privilege, so use a copy.
          curl -fsSL -o tflite.zip \
            "https://github.com/tphakala/tflite_c/releases/download/${TFLITE_VERSION}/tflite_c_${TFLITE_VERSION}_windows_amd64.zip"
          mkdir -p tflite_lib tflite_unzip
          unzip -o tflite.zip -d tflite_unzip
          cp "tflite_unzip/tensorflowlite_c-${TFLITE_VERSION#v}.dll" tflite_lib/tensorflowlite_c.dll
          rm -rf tflite.zip tflite_unzip

      - name: Setup ONNX Runtime
        run: |
          # Inlined instead of the setup-onnxruntime composite action. The action
          # now caches under runner.temp, where actions/cache (Node) and Git Bash
          # agree even on Windows, so it would work here too. This job still
          # downloads into the workspace because it is simpler: no cache for a
          # small zip, and the libs land next to the cygpath DLL-search wiring
          # below. (Historically the action used /tmp, which diverged on Windows.)
          curl -fsSL -o onnxruntime.zip \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-win-x64-${ONNXRUNTIME_VERSION}.zip"
          tmp="$(mktemp -d)"
          unzip -q onnxruntime.zip -d "$tmp"
          mkdir -p onnxruntime
          cp -r "$tmp"/onnxruntime-*/* onnxruntime/
          rm -rf "$tmp" onnxruntime.zip
          ls -la onnxruntime/lib

      - name: Configure CGO and DLL search path
        run: |
          # Native Go/mingw need Windows-style paths. cygpath -m yields a
          # forward-slash Windows path the mingw linker accepts; cygpath -w yields
          # a backslash path for the runtime DLL search ($GITHUB_PATH) that the
          # native test binary's LoadLibrary uses for the TFLite and ONNX DLLs.
          WS_MIXED="$(cygpath -m "$GITHUB_WORKSPACE")"
          {
            echo "CGO_ENABLED=1"
            echo "CGO_CFLAGS=-I${WS_MIXED}/.cache/tensorflow"
            echo "CGO_LDFLAGS=-L${WS_MIXED}/tflite_lib -ltensorflowlite_c"
          } >> "$GITHUB_ENV"
          cygpath -w "$GITHUB_WORKSPACE/tflite_lib" >> "$GITHUB_PATH"
          cygpath -w "$GITHUB_WORKSPACE/onnxruntime/lib" >> "$GITHUB_PATH"

      - name: Run unit tests
        env:
          CI: true
        run: |
          # GitHub runs steps as `bash -eo pipefail`; turn errexit OFF (set +e) so
          # a failing test run does not abort before the summary renders. The
          # explicit `exit "$TEST_EXIT_CODE"` still fails the step.
          set +e

          # Write the -json stream to a file and take pass/fail from go test's own
          # exit code (no gotestfmt: go can wrap non-JSON build output into JSON
          # events whose content crashes its tokenizer). Failed tests are printed
          # below and in the job summary.
          #
          # NO -race on this job (deliberate): the race detector on
          # windows/amd64 + Go 1.26.1 intermittently crashes the Go runtime
          # itself, not the code under test — "fatal error: invalid g status"
          # / "unexpected signal during runtime execution" with GC
          # mark/preemption frames and goid=0. It is nondeterministic, so it
          # red-flagged unrelated PRs roughly one run in five and always
          # passed on rerun. Race coverage is kept on the Linux unit-test job
          # (golangci-test.yml), which runs the same suite with -race on every
          # push; this job's value is verifying the code builds and behaves on
          # native Windows. Revisit if a later Go release fixes the runtime bug.
          #
          # 900s per-package timeout retained: api/v2 (the largest package,
          # ~2000 tests) needs headroom under runner load, and it stays under
          # the 25m step cap below.
          go test -tags noembed,skipfrontend -json -v -short -timeout 900s ./... > gotest.log 2>&1
          TEST_EXIT_CODE=$?

          # `jq -R 'fromjson? // empty'` reads every line as raw text and only
          # keeps it if it parses as JSON, so a stray non-JSON line (a linker
          # warning, a truncated line from a killed process) is skipped instead
          # of killing the whole pipeline - no `grep` pre-filter needed.
          echo "--- Per-test failures ---"
          jq -R -r 'fromjson? // empty | select(.Action == "fail" and .Test) | "FAIL  \(.Package)  \(.Test)"' gotest.log | sort -u

          # Package-level failures (build error, panic outside a test, or a
          # "[setup failed]" package) have a "fail" Action but NO .Test field, so
          # the per-test filter above silently drops them - this is exactly what
          # has been showing up as "no test names" in this job. Always print
          # these plus their raw output so the cause is visible without a rerun.
          #
          # Markers are printed BEFORE the output window deliberately. A Go fatal
          # error or panic prints its one-line header ABOVE a goroutine dump that
          # runs to hundreds or thousands of lines, so a plain tail of a package's
          # output shows only the bottom of that dump and hides the line naming
          # the cause. That truncation is why the -race runtime crash on this job
          # ("fatal error: invalid g status") read as an unexplained flake for a
          # week. Grepping the headers first makes the cause visible in the log
          # view without downloading the artifact.
          FAIL_MARKERS='fatal error:|panic:|\[signal |SIGSEGV|SIGABRT|SIGBUS|DATA RACE|test timed out|\[build failed\]|\[setup failed\]|cannot find package|undefined:'
          MARKER_LINES=40
          PKG_TAIL_LINES=200
          echo "--- Package-level failures (build error / panic / setup failure) ---"
          PKG_FAILS=$(jq -R -r 'fromjson? // empty | select(.Action == "fail" and (.Test | not)) | .Package' gotest.log | sort -u)
          # Accumulate markers in a file, not a shell variable: a multi-line
          # value would have to be written with continuation lines at column 0,
          # which dedents out of this YAML block scalar and makes the workflow
          # unparseable.
          MARKER_FILE=pkg_markers.txt
          : > "$MARKER_FILE"
          if [ -n "$PKG_FAILS" ]; then
            while IFS= read -r pkg; do
              echo "## $pkg"
              # Decode this package's output once: both views below consume it,
              # and re-scanning the whole log per view is wasteful on a big run.
              pkg_out=$(grep -F "\"Package\":\"$pkg\"" gotest.log | jq -R -r 'fromjson? // empty | select(.Action == "output") | .Output')
              markers=$(printf '%s\n' "$pkg_out" | grep -nE "$FAIL_MARKERS" | head -n "$MARKER_LINES")
              if [ -n "$markers" ]; then
                echo "### diagnostic markers (line numbers are within this package's output)"
                printf '%s\n' "$markers"
                { echo "$pkg"; printf '%s\n\n' "$markers"; } >> "$MARKER_FILE"
              else
                echo "### diagnostic markers: (none matched)"
              fi
              echo "### last $PKG_TAIL_LINES lines of this package's output"
              printf '%s\n' "$pkg_out" | tail -n "$PKG_TAIL_LINES"
            done <<< "$PKG_FAILS"
          else
            echo "(none)"
          fi

          # Always show the raw log tail too: covers cases where go test never
          # emits a matching JSON "fail" event at all (e.g. the process is
          # killed by a timeout before it can flush one).
          echo "--- Last 100 lines of gotest.log ---"
          tail -n 100 gotest.log

          if [ "$TEST_EXIT_CODE" -ne 0 ]; then
            echo "::error title=Test Failure::Windows unit tests failed - see job summary for details"
            {
              echo "## :x: Windows Test Run Failed"
              echo ""
              echo "Exit code: $TEST_EXIT_CODE"
              echo ""
              echo "### Quick Preview of Failures"
              echo '```'
              jq -R -r 'fromjson? // empty | select(.Action == "fail" and .Test) | (.Package + " " + .Test)' gotest.log | sort -u | head -20
              echo '```'
              echo ""
              echo "### Package-level Failures"
              echo '```'
              if [ -n "$PKG_FAILS" ]; then echo "$PKG_FAILS"; else echo "(none)"; fi
              echo '```'
              echo ""
              if [ -s "$MARKER_FILE" ]; then
                echo "### Diagnostic Markers"
                echo '```'
                cat "$MARKER_FILE"
                echo '```'
                echo ""
              fi
              echo "### Last 60 Lines of Raw Log"
              echo '```'
              tail -n 60 gotest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$TEST_EXIT_CODE"
          fi

          echo "## :white_check_mark: All Windows Tests Passed" >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 25

      - name: Upload test log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-log-windows
          # pkg_markers.txt is the extracted crash/build-failure headers; it is
          # tiny and is the first thing worth reading when this job goes red.
          path: |
            gotest.log
            pkg_markers.txt
          if-no-files-found: warn

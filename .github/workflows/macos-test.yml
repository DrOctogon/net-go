name: macos-test

# Tier 1 of cross-platform validation: native macOS (Apple Silicon) unit tests.
# Runs the portable unit subset only. The mosquitto service container and the
# Docker-based testcontainer/integration suites are Linux-only, so they stay in
# golangci-test.yml; MQTT tests self-skip here because MQTT_TEST_BROKER is unset.
#
# Non-blocking (continue-on-error) for now: the suite has a small backlog of
# pre-existing macOS-specific test failures (Linux-only assumptions). The job
# reports them for visibility; promote it to a required check once they are
# fixed. See the cross-platform test-cleanup tracking issue.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Taskfile.yml'
      - '.github/workflows/macos-test.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Taskfile.yml'
      - '.github/workflows/macos-test.yml'
      - '.github/actions/**'

permissions:
  contents: read

concurrency:
  group: macos-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-macos:
    name: unit-tests (macos-arm64)
    runs-on: macos-latest
    # Non-blocking until the pre-existing macOS test failures are fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go version

      - name: Resolve tool versions from Taskfile
        run: |
          # Single source of truth: read versions from the Taskfile so the inline
          # TFLite dylib download and the setup-onnxruntime action both stay in
          # lockstep with it (and with the headers `task check-tensorflow`
          # provisions), instead of drifting to the action's hardcoded defaults.
          tflite=$(grep -E '^[[:space:]]*TFLITE_VERSION:' Taskfile.yml | head -1 | tr -d ' ' | cut -d: -f2 | tr -d "'\"")
          onnx=$(grep -E '^[[:space:]]*ONNXRUNTIME_VERSION:' Taskfile.yml | head -1 | tr -d ' ' | cut -d: -f2 | tr -d "'\"")
          if [ -z "$tflite" ] || [ -z "$onnx" ]; then echo "::error::could not read tool versions from Taskfile.yml"; exit 1; fi
          {
            echo "TFLITE_VERSION=${tflite}"
            echo "ONNXRUNTIME_VERSION=${onnx}"
          } >> "$GITHUB_ENV"

      - name: Install FFmpeg and SoX
        run: brew install ffmpeg sox

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup TensorFlow headers
        run: task check-tensorflow

      - name: Setup TensorFlow Lite library
        run: |
          # Provision the native arm64 TFLite dylib into /opt/homebrew/lib, the
          # same location the darwin_arm64 build task uses. Mirrors the symlink
          # naming (libtensorflowlite_c.dylib -> versioned dylib) that lets the
          # linker resolve -ltensorflowlite_c.
          curl -fsSL -o tflite.tgz \
            "https://github.com/tphakala/tflite_c/releases/download/${TFLITE_VERSION}/tflite_c_${TFLITE_VERSION}_darwin_arm64.tar.gz"
          tar -xzf tflite.tgz
          rm -f tflite.tgz
          sudo mkdir -p /opt/homebrew/lib
          sudo mv "libtensorflowlite_c.${TFLITE_VERSION#v}.dylib" /opt/homebrew/lib/
          (cd /opt/homebrew/lib && sudo ln -sf "libtensorflowlite_c.${TFLITE_VERSION#v}.dylib" libtensorflowlite_c.dylib)

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnxruntime
        with:
          target-platform: darwin-arm64
          onnxruntime-version: ${{ env.ONNXRUNTIME_VERSION }}

      - name: Install ONNX Runtime to default loader path
        run: |
          # ONNX Runtime is dlopen'd at runtime via purego, not linked. Copy it
          # to /usr/local/lib, which dyld searches by default even on Apple
          # Silicon, so DYLD_* env vars (stripped by SIP from child test binaries)
          # are not needed.
          sudo mkdir -p /usr/local/lib
          sudo cp -a "${RUNNER_TEMP}"/onnxruntime/lib/libonnxruntime*.dylib /usr/local/lib/

      - name: Run unit tests
        env:
          CI: true
          CGO_ENABLED: 1
          CGO_CFLAGS: -I${{ github.workspace }}/.cache/tensorflow
          # rpath is baked into the test binaries so dyld finds libtensorflowlite_c
          # even though SIP strips DYLD_* from the child processes `go test` spawns.
          CGO_LDFLAGS: -L/opt/homebrew/lib -ltensorflowlite_c -Wl,-rpath,/opt/homebrew/lib
        run: |
          # GitHub runs steps as `bash -eo pipefail`, so a failing `go test`
          # pipeline would abort here before PIPESTATUS is captured and the failure
          # summary never renders. Turn errexit OFF explicitly (set +e); pipefail
          # stays on, and the explicit `exit "$TEST_EXIT_CODE"` still fails the step.
          set +e

          # noembed,skipfrontend skip model/frontend embedding. -short skips the
          # heavy suites; testcontainer/integration tests need the `integration`
          # build tag (not set) and are excluded. Longer timeout than Linux: the
          # native runner with -race is slower, and api/v2 (the largest package,
          # ~2000 tests) intermittently exceeded the old 600s per-package ceiling
          # under runner load (goroutine dump at timeout was idle, i.e. cumulative
          # race-instrumented work, not a deadlock). 900s adds headroom and stays
          # under the 20m step cap below.
          #
          # Write the -json stream to a file and take pass/fail from go test's own
          # exit code. We do NOT pipe through gotestfmt: go wraps the macOS cgo
          # `ld: warning` lines (the go-tflite binding already passes
          # -ltensorflowlite_c, so the rpath/library are harmlessly duplicated)
          # into JSON output events whose content crashes gotestfmt's tokenizer.
          # Failed tests are printed below and in the job summary instead.
          go test -tags noembed,skipfrontend -race -json -v -short -timeout 900s ./... > gotest.log 2>&1
          TEST_EXIT_CODE=$?

          # `jq -R 'fromjson? // empty'` reads every line as raw text and only
          # keeps it if it parses as JSON, so a stray non-JSON line (the macOS
          # cgo `ld: warning` lines mentioned above, a truncated line from a
          # killed process) is skipped instead of killing the whole pipeline -
          # no `grep` pre-filter needed.
          echo "--- Per-test failures ---"
          jq -R -r 'fromjson? // empty | select(.Action == "fail" and .Test) | "FAIL  \(.Package)  \(.Test)"' gotest.log | sort -u

          # Package-level failures (build error, panic outside a test, or a
          # "[setup failed]" package) have a "fail" Action but NO .Test field, so
          # the per-test filter above silently drops them - this is exactly what
          # has been showing up as "no test names" in this job. Always print
          # these plus their raw output so the cause is visible without a rerun.
          #
          # Markers are printed BEFORE the output window deliberately. A Go fatal
          # error or panic prints its one-line header ABOVE a goroutine dump that
          # runs to hundreds or thousands of lines, so a plain tail of a package's
          # output shows only the bottom of that dump and hides the line naming
          # the cause. That truncation is why the windows -race runtime crash
          # ("fatal error: invalid g status") read as an unexplained flake for a
          # week. Grepping the headers first makes the cause visible in the log
          # view without downloading the artifact.
          FAIL_MARKERS='fatal error:|panic:|\[signal |SIGSEGV|SIGABRT|SIGBUS|DATA RACE|test timed out|\[build failed\]|\[setup failed\]|cannot find package|undefined:'
          MARKER_LINES=40
          PKG_TAIL_LINES=200
          echo "--- Package-level failures (build error / panic / setup failure) ---"
          PKG_FAILS=$(jq -R -r 'fromjson? // empty | select(.Action == "fail" and (.Test | not)) | .Package' gotest.log | sort -u)
          # Accumulate markers in a file, not a shell variable: a multi-line
          # value would have to be written with continuation lines at column 0,
          # which dedents out of this YAML block scalar and makes the workflow
          # unparseable.
          MARKER_FILE=pkg_markers.txt
          : > "$MARKER_FILE"
          if [ -n "$PKG_FAILS" ]; then
            while IFS= read -r pkg; do
              echo "## $pkg"
              # Decode this package's output once: both views below consume it,
              # and re-scanning the whole log per view is wasteful on a big run.
              pkg_out=$(grep -F "\"Package\":\"$pkg\"" gotest.log | jq -R -r 'fromjson? // empty | select(.Action == "output") | .Output')
              markers=$(printf '%s\n' "$pkg_out" | grep -nE "$FAIL_MARKERS" | head -n "$MARKER_LINES")
              if [ -n "$markers" ]; then
                echo "### diagnostic markers (line numbers are within this package's output)"
                printf '%s\n' "$markers"
                { echo "$pkg"; printf '%s\n\n' "$markers"; } >> "$MARKER_FILE"
              else
                echo "### diagnostic markers: (none matched)"
              fi
              echo "### last $PKG_TAIL_LINES lines of this package's output"
              printf '%s\n' "$pkg_out" | tail -n "$PKG_TAIL_LINES"
            done <<< "$PKG_FAILS"
          else
            echo "(none)"
          fi

          # Always show the raw log tail too: covers cases where go test never
          # emits a matching JSON "fail" event at all (e.g. the process is
          # killed by a timeout before it can flush one).
          echo "--- Last 100 lines of gotest.log ---"
          tail -n 100 gotest.log

          if [ "$TEST_EXIT_CODE" -ne 0 ]; then
            echo "::error title=Test Failure::macOS unit tests failed - see job summary for details"
            {
              echo "## :x: macOS Test Run Failed"
              echo ""
              echo "Exit code: $TEST_EXIT_CODE"
              echo ""
              echo "### Quick Preview of Failures"
              echo '```'
              jq -R -r 'fromjson? // empty | select(.Action == "fail" and .Test) | (.Package + " " + .Test)' gotest.log | sort -u | head -20
              echo '```'
              echo ""
              echo "### Package-level Failures"
              echo '```'
              if [ -n "$PKG_FAILS" ]; then echo "$PKG_FAILS"; else echo "(none)"; fi
              echo '```'
              echo ""
              if [ -s "$MARKER_FILE" ]; then
                echo "### Diagnostic Markers"
                echo '```'
                cat "$MARKER_FILE"
                echo '```'
                echo ""
              fi
              echo "### Last 60 Lines of Raw Log"
              echo '```'
              tail -n 60 gotest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$TEST_EXIT_CODE"
          fi

          echo "## :white_check_mark: All macOS Tests Passed" >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 20

      - name: Upload test log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-log-macos
          # pkg_markers.txt is the extracted crash/build-failure headers; it is
          # tiny and is the first thing worth reading when this job goes red.
          path: |
            gotest.log
            pkg_markers.txt
          if-no-files-found: warn

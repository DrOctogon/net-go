<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- badge -->
  <circle cx="150" cy="150" r="140" fill="url(#bg)"/>
  <circle cx="150" cy="150" r="140" fill="url(#glow)"/>

  <!-- monitoring ring (watch) -->
  <circle cx="150" cy="150" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="4"
          stroke-dasharray="6 12" stroke-linecap="round"/>

  <!-- voice soundwave: symmetric bars, tall center -->
  <g fill="#ffffff" filter="url(#soft)">
    <rect x="60"  y="135" width="14" height="30"  rx="7"/>
    <rect x="84"  y="118" width="14" height="64"  rx="7"/>
    <rect x="108" y="96"  width="14" height="108" rx="7"/>
    <rect x="132" y="72"  width="14" height="156" rx="7"/>
    <rect x="156" y="96"  width="14" height="108" rx="7"/>
    <rect x="180" y="118" width="14" height="64"  rx="7"/>
    <rect x="204" y="135" width="14" height="30"  rx="7"/>
  </g>
</svg>
